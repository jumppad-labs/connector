---

name: Build
on: [push]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Download what go.mod pins; don't upgrade anything in CI
      - name: Get dependencies
        run: go mod download

      - name: Unit Test
        run: make unit_test

      - name: Build
        run: make snapshot

      - uses: actions/upload-artifact@v7
        with:
          name: connector
          path: ./dist

  functional_test:
    name: Functional Test
    runs-on: ubuntu-latest
    needs: build

    strategy:
      matrix:
        folder: [
          './test/simple',
          './test/kubernetes',
          './test/nomad',
        ]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: connector
          path: dist

      # The runner is amd64, so no emulation is needed for the amd64 image
      - name: Build and load into local Docker
        run: docker build -t connector:dev -f ./Dockerfile ./dist

      - name: Install Deps
        run: |
          curl https://jumppad.dev/install | bash
          echo "${GITHUB_WORKSPACE}/dist/linux_amd64" >> $GITHUB_PATH
          chmod +x ${GITHUB_WORKSPACE}/dist/linux_amd64/connector

      - name: ${{ matrix.folder }}
        run: |
          cd ${{ matrix.folder }}
          jumppad test --var connector_image=connector:dev
