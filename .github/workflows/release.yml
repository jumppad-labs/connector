name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'dev'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: make snapshot

      - uses: actions/upload-artifact@v7
        with:
          name: connector
          path: ./dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Tagged with the git tag, or "dev" for the dev branch
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./dist
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          push: true

      - name: Zip Artifacts
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          zip ./dist/darwin_amd64.zip ./dist/darwin_amd64/connector
          zip ./dist/linux_amd64.zip ./dist/linux_amd64/connector
          zip ./dist/darwin_arm64.zip ./dist/darwin_arm64/connector
          zip ./dist/linux_arm64.zip ./dist/linux_arm64/connector

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            ./dist/darwin_amd64.zip
            ./dist/linux_amd64.zip
            ./dist/darwin_arm64.zip
            ./dist/linux_arm64.zip
